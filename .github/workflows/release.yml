name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  id-token: write
  attestations: write
jobs:
  build:
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, ext: "" }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, ext: .exe }
          - { os: macos-13, target: x86_64-apple-darwin, ext: "" }
          - { os: macos-14, target: aarch64-apple-darwin, ext: "" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - shell: bash
        run: |
          mkdir dist
          cp "target/${{ matrix.target }}/release/rollout_guard${{ matrix.ext }}" dist/
          cp README.md README.zh-CN.md LICENSE dist/
          tar -czf "rollout_guard-${GITHUB_REF_NAME}-${{ matrix.target }}.tar.gz" -C dist .
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: rollout_guard-*.tar.gz
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: dist/SBOM.spdx.json
      - shell: bash
        run: |
          jq '[.packages[] | {name, versionInfo, licenseConcluded, licenseDeclared}]' dist/SBOM.spdx.json > dist/LICENSES.json
          cd dist
          sha256sum *.tar.gz SBOM.spdx.json LICENSES.json > SHA256SUMS
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*.tar.gz
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --prerelease
