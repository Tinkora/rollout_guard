[package]
name = "rollout_guard"
version = "0.1.0-alpha.1"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "Privacy-first offline JSONL risk inspection for agent rollout artifacts"
repository = "https://github.com/Tinkora/rollout_guard"

[dependencies]
anyhow = "1.0"
base64 = "0.23"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"

[dev-dependencies]
tempfile = "3.12"
